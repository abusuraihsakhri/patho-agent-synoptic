[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patho-engine-synoptic"
version = "2.0.0"
description = "Rule-based pathology workflow demonstration and case-triage utilities"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.100,<1", "uvicorn>=0.20,<1"]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["agents*", "patho_agent_synoptic*"]

[project.scripts]
patho-engine-synoptic = "patho_agent_synoptic.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/patho-agent-synoptic"
Repository = "https://github.com/abusuraihsakhri/patho-agent-synoptic.git"
