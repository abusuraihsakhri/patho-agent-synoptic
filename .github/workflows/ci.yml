name: Patho Engine Synoptic CI/CD & Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install '.[server,dev]'

    - name: Compile Python sources
      run: python -m compileall -q agents patho_agent_synoptic cli.py patho_synoptic.py

    - name: Check browser demo
      run: node web/test-app.cjs

    - name: Run Pytest Suite
      env:
        AUDIT_SECRET_KEY: test-key-for-ci-only-not-for-production
      run: |
        pytest -v

    - name: Audit-chain Smoke Check
      env:
        AUDIT_SECRET_KEY: test-key-for-ci-only-not-for-production
      run: |
        python -c "
        from agents.base import AuditLogger
        assert AuditLogger.verify_integrity() is True
        print('Audit-chain smoke check passed')
        "
